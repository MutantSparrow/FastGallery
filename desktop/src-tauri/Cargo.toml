[package]
name = "fast-gallery"
version = "1.6.1"
description = "Fast Gallery — desktop wrapper"
authors = ["Fast Gallery"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fast_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "rayon"] }
sha1 = "0.10"
notify = "6"
notify-debouncer-full = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
